[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-synapse-research"
version = "0.2.0"
description = "Deterministic ResearchField 3D spatial experiment for New Synapse"
requires-python = ">=3.11"

[project.scripts]
new-synapse = "knowledge_galaxy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
