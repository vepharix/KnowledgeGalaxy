[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-galaxy"
version = "0.3.0"
description = "Deterministic ResearchField graph engine and 3D diagnostic viewer for Knowledge Galaxy"
requires-python = ">=3.11"

[project.scripts]
knowledge-galaxy = "knowledge_galaxy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
