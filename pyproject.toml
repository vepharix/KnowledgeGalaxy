[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-galaxy"
version = "1.0.0"
description = "Deterministic knowledge graph engine, mathematical concept alignment and diagnostic viewer"
requires-python = ">=3.11"

[project.scripts]
knowledge-galaxy = "knowledge_galaxy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
